{% extends 'base.html' %}{% block title %}Choose services | EventEase{% endblock %}{% block content %}<main class="flow-page"><div class="steps"><span>1 Event</span><span class="active">2 Services</span><span>3 Vendor</span><span>4 Confirm</span></div><section class="flow-card"><p class="eyebrow">BUILD YOUR PERFECT DAY</p><h1>Which services do you need?</h1><form method="post"><div class="select-grid">{% for s in services %}<label class="select-card"><input type="checkbox" name="services" value="{{ s.id }}" {% if s.id in selected %}checked{% endif %}><img src="{{ url_for('static', filename=s.image) }}" alt=""><span><b>{{ s.name }}</b><small>{{ s.description }}</small></span></label>{% endfor %}</div><button class="btn">Find vendors →</button></form></section></main>{% endblock %}
