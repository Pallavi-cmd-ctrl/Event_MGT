{% extends 'base.html' %}{% block title %}Plan your event | EventEase{% endblock %}{% block content %}<main class="flow-page"><div class="steps"><span class="active">1 Event</span><span>2 Services</span><span>3 Vendor</span><span>4 Confirm</span></div><section class="flow-card"><p class="eyebrow">LET’S START WITH THE BASICS</p><h1>Tell us about your event</h1><form method="post"><div class="two-col"><label>What are you celebrating?<select name="event_type">{% for t in ['Wedding','Birthday Party','Anniversary','Corporate Event','Baby Shower','Other'] %}<option {% if event.event_type == t %}selected{% endif %}>{{ t }}</option>{% endfor %}</select></label><label>Event date<input type="date" name="event_date" min="{{ now|default('') }}" value="{{ event.event_date|default('') }}" required></label><label>Expected guests<input type="number" name="guests" min="1" value="{{ event.guests|default('50') }}" required></label><label>Venue / city<input name="venue" value="{{ event.venue|default('') }}" placeholder="e.g. The Grand Palace, Delhi" required></label></div><label>Anything else we should know?<textarea name="notes" rows="3" placeholder="Theme, requirements, or special requests">{{ event.notes|default('') }}</textarea></label><button class="btn">Choose services →</button></form></section></main>{% endblock %}
